name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission
        run: chmod +x easycontrol/gradlew

      - name: Clean project
        run: cd easycontrol && ./gradlew clean

      

      # ---------- 编译 server 模块并放入 raw 目录 ----------
      - name: Build easycontrol_server
        run: |
          cd easycontrol
          ./gradlew :server:assembleDebug
          mkdir -p app/src/main/res/raw
          cp server/build/outputs/apk/debug/server-debug.apk app/src/main/res/raw/easycontrol_server

      - name: Build APK
        run: cd easycontrol && ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: easycontrol/app/build/outputs/apk/debug/*.apk
