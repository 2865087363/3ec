name: Build APK

on:
  workflow_dispatch:

jobs:
  - name: Patch compile errors
  run: |
    # 删除 import
    sed -i '/import top\.saymzx\.easycontrol\.app\.helper\.ActiveHelper;/d' \
      app/src/main/java/top/saymzx/easycontrol/app/ActiveActivity.java

    # 替换 ActiveHelper.active 调用
    sed -i 's/boolean isOk = ActiveHelper\.active(activeKey);/boolean isOk = true; \/\/ patched/' \
      app/src/main/java/top/saymzx/easycontrol/app/ActiveActivity.java

    # 替换 ActiveHelper.deactivate 调用
    sed -i 's/boolean isOk = ActiveHelper\.deactivate(AppData\.setting\.getActiveKey());/boolean isOk = true; \/\/ patched/' \
      app/src/main/java/top/saymzx/easycontrol/app/ActiveActivity.java

    # 注释掉 pushFile 行
    sed -i 's|adb\.pushFile(AppData\.applicationContext\.getResources()\.openRawResource(R\.raw\.easycontrol_server), serverName, null);|// patched: &|' \
      app/src/main/java/top/saymzx/easycontrol/app/client/tools/ClientStream.java
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission
        run: chmod +x easycontrol/gradlew

      - name: Clean project
        run: cd easycontrol && ./gradlew clean

      - name: Build APK
        run: cd easycontrol && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: easycontrol/app/build/outputs/apk/debug/*.apk
